name: kvlite
on:
  push:
    paths: ['projects/kvlite/**', '.github/workflows/kvlite.yml']
  pull_request:
    paths: ['projects/kvlite/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/kvlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test -race ./...
