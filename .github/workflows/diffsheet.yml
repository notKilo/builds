name: diffsheet
on:
  push:
    paths: ['projects/diffsheet/**', '.github/workflows/diffsheet.yml']
  pull_request:
    paths: ['projects/diffsheet/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/diffsheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
