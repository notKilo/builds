name: cronwhy
on:
  push:
    paths: ['projects/cronwhy/**', '.github/workflows/cronwhy.yml']
  pull_request:
    paths: ['projects/cronwhy/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cronwhy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
