name: envdiff
on:
  push:
    paths: ['projects/envdiff/**', '.github/workflows/envdiff.yml']
  pull_request:
    paths: ['projects/envdiff/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/envdiff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test -race ./...
