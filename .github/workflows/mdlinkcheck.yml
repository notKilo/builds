name: mdlinkcheck
on:
  push:
    paths: ['projects/mdlinkcheck/**', '.github/workflows/mdlinkcheck.yml']
  pull_request:
    paths: ['projects/mdlinkcheck/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mdlinkcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
